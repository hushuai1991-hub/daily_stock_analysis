<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #eee;
  }
  h1 { font-size: 2rem; margin-bottom: 10px; color: #00d4aa; letter-spacing: 4px; }
  #score-board {
    display: flex;
    gap: 40px;
    margin-bottom: 16px;
    font-size: 1rem;
    color: #aaa;
  }
  #score-board span { color: #fff; font-weight: bold; font-size: 1.2rem; }
  canvas {
    border: 2px solid #00d4aa;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(0, 212, 170, 0.3);
  }
  #message {
    margin-top: 20px;
    font-size: 1rem;
    color: #aaa;
    letter-spacing: 1px;
    min-height: 24px;
  }
  #message b { color: #00d4aa; }
</style>
</head>
<body>
<h1>贪 吃 蛇</h1>
<div id="score-board">
  <div>得分 <span id="score">0</span></div>
  <div>最高 <span id="best">0</span></div>
  <div>速度 <span id="level">1</span></div>
</div>
<canvas id="c" width="480" height="480"></canvas>
<div id="message"><b>按空格键 / 点击</b> 开始游戏</div>

<script>
const COLS = 24, ROWS = 24, CELL = 20;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let snake, dir, nextDir, food, score, best, running, interval, started;

best = parseInt(localStorage.getItem('snakeBest') || '0');
document.getElementById('best').textContent = best;

function init() {
  snake = [
    {x: 12, y: 12},
    {x: 11, y: 12},
    {x: 10, y: 12}
  ];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('level').textContent = 1;
  spawnFood();
  draw();
}

function spawnFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function getSpeed() {
  const lv = Math.floor(score / 5) + 1;
  return Math.max(60, 200 - (lv - 1) * 15);
}

function start() {
  if (running) return;
  init();
  running = true;
  started = true;
  document.getElementById('message').innerHTML = '方向键 / WASD 控制方向';
  clearInterval(interval);
  interval = setInterval(tick, getSpeed());
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return gameOver();
  }
  // 撞自身
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      document.getElementById('best').textContent = best;
    }
    const lv = Math.floor(score / 5) + 1;
    document.getElementById('level').textContent = lv;
    spawnFood();
    // 提速
    clearInterval(interval);
    interval = setInterval(tick, getSpeed());
  } else {
    snake.pop();
  }

  draw();
}

function gameOver() {
  running = false;
  clearInterval(interval);
  draw();
  document.getElementById('message').innerHTML =
    `游戏结束！得分 <b>${score}</b> &nbsp;｜&nbsp; <b>空格键 / 点击</b> 重新开始`;
}

function draw() {
  // 背景
  ctx.fillStyle = '#0f0f23';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 网格（淡）
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke();
  }

  // 食物
  const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2, fr = CELL / 2 - 2;
  const grad = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr);
  grad.addColorStop(0, '#ffdd57');
  grad.addColorStop(1, '#ff6b6b');
  ctx.beginPath();
  ctx.arc(fx, fy, fr, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // 蛇身
  snake.forEach((s, i) => {
    const x = s.x * CELL + 1, y = s.y * CELL + 1, w = CELL - 2;
    const ratio = i / snake.length;
    const r = Math.round(0 + ratio * 0);
    const g = Math.round(212 - ratio * 80);
    const b = Math.round(170 - ratio * 60);
    ctx.fillStyle = i === 0 ? '#00d4aa' : `rgb(${r},${g},${b})`;
    ctx.beginPath();
    ctx.roundRect(x, y, w, w, i === 0 ? 5 : 3);
    ctx.fill();

    // 蛇头眼睛
    if (i === 0) {
      ctx.fillStyle = '#0f0f23';
      const ex = s.x * CELL + CELL / 2 + dir.x * 4;
      const ey = s.y * CELL + CELL / 2 + dir.y * 4;
      const offset = dir.x !== 0 ? {dx: 0, dy: 4} : {dx: 4, dy: 0};
      ctx.beginPath(); ctx.arc(ex + offset.dx, ey - offset.dy, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex - offset.dx, ey + offset.dy, 2, 0, Math.PI * 2); ctx.fill();
    }
  });

  // 死亡遮罩
  if (!running && started) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

// 键盘控制
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); start(); return; }
  const map = {
    ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1}, ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0},
    KeyW: {x:0,y:-1}, KeyS: {x:0,y:1}, KeyA: {x:-1,y:0}, KeyD: {x:1,y:0},
  };
  const d = map[e.code];
  if (d && !(d.x === -dir.x && d.y === -dir.y)) {
    nextDir = d;
    e.preventDefault();
  }
});

// 触屏 / 点击
canvas.addEventListener('click', () => { if (!running) start(); });

// 触屏滑动
let touchStart = null;
canvas.addEventListener('touchstart', e => { touchStart = e.touches[0]; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) { if (!running) start(); return; }
  let d;
  if (Math.abs(dx) > Math.abs(dy)) d = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
  else d = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
  if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  e.preventDefault();
}, {passive:false});

init();
draw();
</script>
</body>
</html>
